<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <title>VIAssist 온디바이스 아키텍처</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#111"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#ffffff"/>

  <!-- Jetson 한 대 -->
  <rect x="20" y="20" width="1160" height="520" rx="6" fill="none" stroke="#76B900" stroke-width="2.5"/>
  <rect x="20" y="20" width="44" height="40" fill="#76B900"/>
  <text x="42" y="47" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">J</text>
  <text x="78" y="48" font-size="24" font-weight="700" fill="#111">NVIDIA Jetson Orin Nano 8GB · 온디바이스</text>
  <text x="1160" y="48" font-size="18" fill="#555" text-anchor="end">JetPack L4T R36.5.2 · Python 3.10 · PyTorch 2.3 (CUDA 12.6)</text>

  <!-- 열 머리 -->
  <g font-size="18" fill="#777" font-weight="700" text-anchor="middle">
    <text x="115" y="88">입력</text>
    <text x="350" y="88">인지</text>
    <text x="600" y="88">판단</text>
    <text x="860" y="88">응답</text>
    <text x="1100" y="88">출력</text>
  </g>

  <!-- 입력 -->
  <rect x="40" y="110" width="150" height="90" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="115" y="150" font-size="24" font-weight="700" fill="#111" text-anchor="middle">USB 카메라</text>
  <text x="115" y="178" font-size="18" fill="#555" text-anchor="middle">영상 프레임</text>
  <rect x="40" y="330" width="150" height="90" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="115" y="370" font-size="24" font-weight="700" fill="#111" text-anchor="middle">마이크</text>
  <text x="115" y="398" font-size="18" fill="#555" text-anchor="middle">사용자 질문</text>

  <!-- 인지 -->
  <g fill="#e8f1fb" stroke="#2f6fd6" stroke-width="1.5">
    <rect x="230" y="100" width="240" height="90" rx="8"/>
    <rect x="230" y="210" width="240" height="90" rx="8"/>
    <rect x="230" y="330" width="240" height="90" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="350" y="140" font-size="24" font-weight="700" fill="#111">YOLO</text>
    <text x="350" y="168" font-size="18" fill="#444">ultralytics · best.pt · 33종</text>
    <text x="350" y="250" font-size="24" font-weight="700" fill="#111">Optical Flow</text>
    <text x="350" y="278" font-size="18" fill="#444">Farneback · 흔들림 보정</text>
    <text x="350" y="370" font-size="24" font-weight="700" fill="#111">STT</text>
    <text x="350" y="398" font-size="18" fill="#444">faster-whisper · int8 · VAD</text>
  </g>

  <!-- 판단 -->
  <rect x="510" y="100" width="180" height="320" rx="8" fill="#fff4d6" stroke="#c98a00" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="600" y="232" font-size="24" font-weight="700" fill="#111">라우터</text>
    <text x="600" y="262" font-size="18" fill="#444">guidance_router</text>
    <text x="600" y="288" font-size="18" fill="#444">Flask :5000</text>
  </g>

  <!-- 응답 -->
  <rect x="730" y="100" width="260" height="90" rx="8" fill="#e3f5e8" stroke="#28a745" stroke-width="1.5"/>
  <rect x="730" y="210" width="260" height="100" rx="8" fill="#efe9fb" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="730" y="340" width="260" height="80" rx="8" fill="#f7f3fe" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g text-anchor="middle">
    <text x="860" y="140" font-size="24" font-weight="700" fill="#111">규칙 안내</text>
    <text x="860" y="168" font-size="18" fill="#444">class_rules · 1.4 ms</text>
    <text x="860" y="244" font-size="24" font-weight="700" fill="#111">VLM</text>
    <text x="860" y="272" font-size="18" fill="#444">SmolVLM-500M Q8</text>
    <text x="860" y="296" font-size="18" fill="#444">llama.cpp · 0.62 s</text>
    <text x="860" y="376" font-size="22" font-weight="700" fill="#111">Safety Validator</text>
    <text x="860" y="402" font-size="18" fill="#444">실패 시 고정 문장</text>
  </g>

  <!-- 출력 -->
  <rect x="1025" y="170" width="150" height="100" rx="8" fill="#fdece6" stroke="#e05a2b" stroke-width="1.5"/>
  <rect x="1025" y="330" width="150" height="80" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="1100" y="210" font-size="24" font-weight="700" fill="#111">TTS</text>
    <text x="1100" y="238" font-size="18" fill="#444">MeloTTS-Korean</text>
    <text x="1100" y="378" font-size="24" font-weight="700" fill="#111">스피커</text>
  </g>

  <!-- 흐름 -->
  <g stroke="#111" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M190 145 L228 145"/>
    <path d="M190 180 L210 180 L210 255 L228 255"/>
    <path d="M190 375 L228 375"/>
    <path d="M470 145 L508 145"/>
    <path d="M470 255 L508 255"/>
    <path d="M470 375 L508 375"/>
    <path d="M690 145 L728 145"/>
    <path d="M690 260 L728 260"/>
    <path d="M860 310 L860 338"/>
    <path d="M990 145 L1007 145 L1007 200 L1023 200"/>
    <path d="M990 380 L1007 380 L1007 240 L1023 240"/>
    <path d="M1100 270 L1100 328"/>
  </g>

  <!-- 통합 메모리 예산 (09-05 실측, 누적) -->
  <text x="40" y="468" font-size="18" font-weight="700" fill="#333">통합 메모리 7.6 GB — 전체 스택 ≈ 6.0 GB</text>
  <g font-size="16" text-anchor="middle" fill="#111">
    <rect x="40" y="482" width="190" height="36" fill="#e5e7eb"/>
    <text x="135" y="506">OS · 기본 1.3</text>
    <rect x="230" y="482" width="130" height="36" fill="#cfe0f7"/>
    <text x="295" y="506">YOLO·Flow 0.9</text>
    <rect x="360" y="482" width="306" height="36" fill="#fbd9cc"/>
    <text x="513" y="506">STT · TTS 2.1</text>
    <rect x="666" y="482" width="246" height="36" fill="#e2d7fa"/>
    <text x="789" y="506">VLM 1.7</text>
    <rect x="912" y="482" width="248" height="36" fill="#fff" stroke="#bbb" stroke-dasharray="4 4"/>
    <text x="1036" y="506" fill="#777">여유</text>
  </g>

  <!-- 선택 · 클라우드 -->
  <rect x="20" y="565" width="1160" height="64" rx="6" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="40" y="604" font-size="20" font-weight="700" fill="#555">선택 · 클라우드 (기본 설정에선 사용 안 함)</text>
  <text x="1160" y="604" font-size="18" fill="#666" text-anchor="end">Gemini — VLM 엔진 옵션 · gTTS — TTS 예비</text>
</svg>
